<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>03 — Action list | stimulus_sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="../dist/stimulus_sheet.css" />
  <link rel="stylesheet" href="_shared.css" />
</head>
<body class="phone">
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>03 — Action list</h1>
  <p class="lede">A typical iOS-style action sheet: sectioned, icon-on-the-left rows, with a destructive action at the bottom.</p>

  <div class="row">
    <button class="demo-btn"
            data-controller="sheet-trigger"
            data-sheet-trigger-id-value="actionSheet"
            data-sheet-trigger-expanded-value="true"
            data-action="click->sheet-trigger#open">
      More…
    </button>
  </div>

  <div data-controller="sheet"
       data-sheet-id-value="actionSheet"
       data-sheet-initial-expanded-value="true">
    <div class="ss-sheet-backdrop" data-sheet-target="backdrop" data-action="click->sheet#close"></div>
    <div class="ss-sheet" data-sheet-target="sheet">
      <div class="ss-sheet-handle" data-sheet-target="handle"></div>
      <div class="ss-sheet-scroll" data-sheet-target="scroll">
        <div class="ss-section-title">Customer</div>
        <button type="button" class="ss-item" data-action="click->sheet#close">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Open contact
        </button>
        <button type="button" class="ss-item" data-action="click->sheet#close">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg>
          Email customer
        </button>
        <button type="button" class="ss-item" data-action="click->sheet#close">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.37 1.9.72 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0122 16.92z"/></svg>
          Call mobile
        </button>

        <div class="ss-section-title">Quote</div>
        <button type="button" class="ss-item" data-action="click->sheet#close">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Download PDF
        </button>
        <button type="button" class="ss-item" data-action="click->sheet#close">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send to customer
        </button>
        <button type="button" class="ss-item" data-action="click->sheet#close">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Duplicate
        </button>

        <div class="ss-section-title">Other</div>
        <button type="button" class="ss-item ss-item-destructive" data-action="click->sheet#close">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          Cancel quote
        </button>
      </div>
    </div>
  </div>

  <script src="../dist/stimulus_sheet.js"></script>
  <script>StimulusSheet.start();</script>
</body>
</html>
